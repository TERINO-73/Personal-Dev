version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: mysql_spring
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: spring_db
      MYSQL_USER: spring_user
      MYSQL_PASSWORD: spring_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
